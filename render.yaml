services:
  - type: web
    name: zestmedia-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-images
  - type: web
    name: zestmedia-web
    runtime: node
    rootDir: frontend
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: zestmedia-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
